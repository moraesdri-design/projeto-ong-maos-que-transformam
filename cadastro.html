<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - ONG Mãos que Transformam</title>

    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <header>

        <h1>Cadastro de Colaborador</h1>

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>

    </header>

    <main>

        <section>

            <h2>Quero fazer parte</h2>

            <p>
                Preencha os dados abaixo para demonstrar seu interesse
                em apoiar nossas ações como colaborador ou voluntário.
            </p>

            <p>
                <strong>* Campos obrigatórios</strong>
            </p>

        </section>

      <form action="#" method="post"
      onsubmit="return false;">

            <fieldset>

                <legend>Dados Pessoais</legend>

                <label for="nome">
                    Nome completo *
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    autocomplete="name"
                    required
                >

                <label for="cpf">
                    CPF *
                </label>

                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="000.000.000-00"
                    inputmode="numeric"
                    pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                    title="Digite o CPF no formato 000.000.000-00"
                    required
                >

                <label for="nascimento">
                    Data de nascimento *
                </label>

                <input
                    type="date"
                    id="nascimento"
                    name="nascimento"
                    autocomplete="bday"
                    required
                >

            </fieldset>


            <fieldset>

                <legend>Contato</legend>

                <label for="email">
                    E-mail *
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >

                <label for="telefone">
                    Telefone *
                </label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    inputmode="tel"
                    pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                    title="Digite o telefone no formato (00) 00000-0000"
                    autocomplete="tel"
                    required
                >

            </fieldset>


            <fieldset>

                <legend>Endereço</legend>

                <label for="cep">
                    CEP *
                </label>

                <input
                    type="text"
                    id="cep"
                    name="cep"
                    placeholder="00000-000"
                    inputmode="numeric"
                    pattern="[0-9]{5}-[0-9]{3}"
                    title="Digite o CEP no formato 00000-000"
                    autocomplete="postal-code"
                    required
                >

                <label for="endereco">
                    Endereço *
                </label>

                <input
                    type="text"
                    id="endereco"
                    name="endereco"
                    autocomplete="street-address"
                    required
                >

                <label for="numero">
                    Número *
                </label>

                <input
                    type="text"
                    id="numero"
                    name="numero"
                    required
                >

                <label for="complemento">
                    Complemento
                </label>

                <input
                    type="text"
                    id="complemento"
                    name="complemento"
                >

                <label for="cidade">
                    Cidade *
                </label>

                <input
                    type="text"
                    id="cidade"
                    name="cidade"
                    autocomplete="address-level2"
                    required
                >

                <label for="estado">
                    Estado *
                </label>

                <select
                    id="estado"
                    name="estado"
                    required
                >

                    <option value="">
                        Selecione
                    </option>

                    <option value="SP">
                        São Paulo
                    </option>

                    <option value="RJ">
                        Rio de Janeiro
                    </option>

                    <option value="MG">
                        Minas Gerais
                    </option>

                    <option value="ES">
                        Espírito Santo
                    </option>

                    <option value="PR">
                        Paraná
                    </option>

                    <option value="SC">
                        Santa Catarina
                    </option>

                    <option value="RS">
                        Rio Grande do Sul
                    </option>

                    <option value="BA">
                        Bahia
                    </option>

                    <option value="CE">
                        Ceará
                    </option>

                    <option value="GO">
                        Goiás
                    </option>

                    <option value="DF">
                        Distrito Federal
                    </option>

                    <option value="PE">
                        Pernambuco
                    </option>

                    <option value="OUTRO">
                        Outro
                    </option>

                </select>

            </fieldset>


            <fieldset>

                <legend>Interesse</legend>

                <label for="participacao">
                    Como deseja participar? *
                </label>

                <select
                    id="participacao"
                    name="participacao"
                    required
                >

                    <option value="">
                        Selecione
                    </option>

                    <option value="doacao">
                        Doação financeira
                    </option>

                    <option value="voluntariado">
                        Trabalho voluntário
                    </option>

                    <option value="ambos">
                        Doação e voluntariado
                    </option>

                </select>

                <label for="mensagem">
                    Mensagem
                </label>

                <textarea
                    id="mensagem"
                    name="mensagem"
                    rows="5"
                    placeholder="Conte como gostaria de contribuir."
                ></textarea>

            </fieldset>


            <button type="submit">
                Enviar cadastro
            </button>

            <button type="reset">
                Limpar formulário
            </button>

        </form>

    </main>


    <footer>

        <p>
            &copy; 2026 - ONG Mãos que Transformam
        </p>

    </footer>

</body>

</html>
